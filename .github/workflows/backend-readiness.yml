name: Lovelies backend readiness
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres@sha256:99b1729aeb0bac314445024fc149fbd39306170b61dd50800ccf180327ab3459
        env:
          POSTGRES_PASSWORD: disposable-ci-fixture-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:disposable-ci-fixture-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm backend:build
      - run: pnpm backend:test
      - name: Run PGlite-only recovery regressions
        working-directory: services/supabase-api
        shell: bash
        run: |
          set -euo pipefail
          report_file="$(mktemp "${TMPDIR:-/tmp}/lovelies-pglite.XXXXXXXX")"
          trap 'rm -f "$report_file"' EXIT
          env -u TEST_DATABASE_URL node --experimental-transform-types \
            --import ./test/offline-regression-guard.mjs --test --test-reporter=tap \
            --test-concurrency=1 test/retention-finalization-count.test.mjs \
            test/notification-redirect-cancel.test.mjs \
            test/service-fetcher-push-consumer.test.mjs \
            test/apple-submission-v2.test.mjs \
            test/apple-submission-v2-restore.test.mjs \
            test/store-session-authority.test.mjs \
            test/job-stale-completion.test.mjs \
            test/notification-terminal-race.test.mjs \
            test/notification-unconfirmed-delivery.test.mjs \
            test/notification-device-removal-race.test.mjs \
            test/notification-logout-delivery-race.test.mjs \
            test/storage-status-cleanup-runtime.test.mjs | tee "$report_file"
          grep -qx '# tests 126' "$report_file"
          grep -qx '# pass 126' "$report_file"
          grep -qx '# fail 0' "$report_file"
          grep -qx '# skipped 0' "$report_file"
      - name: Run PGlite-only privacy grant recovery regressions
        working-directory: services/supabase-api
        shell: bash
        run: |
          set -euo pipefail
          report_file="$(mktemp "${TMPDIR:-/tmp}/lovelies-privacy-grant.XXXXXXXX")"
          trap 'rm -f "$report_file"' EXIT
          cases=(
            'keyed grant and privacy lookup replay the same one-use result without plaintext persistence'
            'a lost committed grant reply is recovered by original key without another grant'
            'changed request and same-account session reject the old key without creating another grant'
            'expired grants cannot be recovered or replayed as live'
            'consumed grants cannot be recovered and survive legacy cleanup until expiry'
            'missing, altered or corrupted stored grant data fails closed and never creates a replacement'
            'legacy no-key grants remain usable and do not create a keyed operation'
            'privacy request operation receipt coexists while a reused key remains unresolved'
            'expired grant receipt retention honors holds and verifies encrypted receipt binding'
            'unknown privacy operation remains unknown without issuing a grant'
            'lost fenced COMMIT reply reconciles the exact grant without redispatch'
            'lost independent prepare reply fences retries without issuing an additional grant'
            'partial grant tombstones fail before conflicts while intact retirement and genuine conflicts remain distinct'
            'a damaged prior action remains unresolved, including a recomputed unkeyed hash'
            'renewed session learns only a verified expired grant status and can issue a fresh key'
            'privacy expiry after journal prepare leaves the accepted plan pending and no SQL grant'
            'privacy session revocation after journal prepare rolls back SQL and leaves a pending plan'
            'privacy expiry during SQL commit returns unresolved with a committed journal receipt'
            'privacy revocation after journal acknowledgement suppresses the committed grant'
            'privacy expiry during final admitted response suppresses an already committed grant'
            'a read-only grant receipt suppresses final session expiry without claiming a write'
            'own privacy grant authority does not require active face consent or audience capability'
            'logout remains terminal without installing privacy grant authority'
            'anonymous own account deletion remains available without the grant postguard'
            'postcommit session failure remains unresolved even if authority returns before final release'
            'consumption is not expiry until the exact authenticated grant deadline has passed'
            'missing or corrupted expired grant rows and revoked request evidence do not assert exact expiry'
            'damaged retired action or hash cannot produce a definitive grant outcome'
            'damaged or missing receipt grant identifiers cannot cause expired row cleanup'
            'final grant lookup admission detects consumption and suppresses the prior bearer'
            'final expired-status admission detects a changed exact grant row'
            'keyed grant consumption after acknowledgement suppresses its committed response'
            'legacy no-key grant keeps its shape and becomes unresolved on postcommit session expiry'
            'final grant admission detects publication retirement before releasing a bearer'
            'malformed bound expiry fields never produce a terminal disposition'
          )
          node --input-type=module -e '
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const source = fs.readFileSync("test/privacy-export-grant-idempotency.test.mjs", "utf8");
          const declared = [...source.matchAll(/^test\(\x27([^\x27]+)\x27/gm)].map(match => match[1]);
          assert.deepEqual(declared, process.argv.slice(1), "offline privacy case list changed");
          ' "${cases[@]}"
          for test_case in "${cases[@]}"; do
            selector="$(node -e 'process.stdout.write("^" + process.argv[1].replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "$")' "$test_case")"
            env -u TEST_DATABASE_URL node --experimental-transform-types \
              --import ./test/offline-regression-guard.mjs --test --test-isolation=none \
              --test-reporter=tap --test-concurrency=1 --test-timeout=30000 \
              --test-name-pattern="$selector" test/privacy-export-grant-idempotency.test.mjs | tee "$report_file"
            [[ "$(grep -c '^ok [0-9][0-9]* - ' "$report_file")" == 1 ]]
            ! grep -q '^not ok ' "$report_file"
            grep -Fqx "ok 1 - $test_case" "$report_file"
            for summary in 'tests 1' 'pass 1' 'fail 0' 'cancelled 0' 'skipped 0' 'todo 0'; do
              [[ "$(grep -c "^# ${summary%% *} " "$report_file")" == 1 ]]
              grep -Fxq "# $summary" "$report_file"
            done
          done
      - name: Run PGlite-only generic store recovery regressions
        working-directory: services/supabase-api
        shell: bash
        run: |
          set -euo pipefail
          report_file="$(mktemp "${TMPDIR:-/tmp}/lovelies-generic-store.XXXXXXXX")"
          trap 'rm -f "$report_file"' EXIT
          cases=(
            'generic lookup does not release an intact store receipt'
            'generic lookup does not classify a retired store receipt as definitive'
            'generic lookup does not emit a mixed-source conflict when a store row exists'
            'a store action with a damaged source is withheld by the generic lookup'
            'generic personal and absent operation behavior remains available'
          )
          node --input-type=module -e '
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const source = fs.readFileSync("test/generic-store-operation.test.mjs", "utf8");
          const declared = [...source.matchAll(/^test\(\x27([^\x27]+)\x27/gm)].map(match => match[1]);
          assert.deepEqual(declared, process.argv.slice(1), "offline generic store case list changed");
          ' "${cases[@]}"
          for test_case in "${cases[@]}"; do
            selector="$(node -e 'process.stdout.write("^" + process.argv[1].replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "$")' "$test_case")"
            env -u TEST_DATABASE_URL node --experimental-transform-types \
              --import ./test/offline-regression-guard.mjs --test --test-isolation=none \
              --test-reporter=tap --test-concurrency=1 --test-timeout=30000 \
              --test-name-pattern="$selector" test/generic-store-operation.test.mjs | tee "$report_file"
            [[ "$(grep -c '^ok [0-9][0-9]* - ' "$report_file")" == 1 ]]
            ! grep -q '^not ok ' "$report_file"
            grep -Fqx "ok 1 - $test_case" "$report_file"
            for summary in 'tests 1' 'pass 1' 'fail 0' 'cancelled 0' 'skipped 0' 'todo 0'; do
              [[ "$(grep -c "^# ${summary%% *} " "$report_file")" == 1 ]]
              grep -Fxq "# $summary" "$report_file"
            done
          done
      - run: pnpm backend:client:test
      - run: node --test services/link-association-worker/test/worker.test.mjs
      - run: pnpm backup:test
      - run: pnpm admin:test
      - run: pnpm preview:test
      - run: pnpm push:check
      - run: pnpm push:test
# This workflow has no production secrets and never deploys or submits a store
# build. Models, real Storage, providers, native builds and hosted acceptance have
# separate required evidence. Earlier GitHub runs stopped before any jobs;
# this revised workflow has not passed GitHub CI.
