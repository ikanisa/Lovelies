name: Lovelies backend readiness
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres@sha256:99b1729aeb0bac314445024fc149fbd39306170b61dd50800ccf180327ab3459
        env:
          POSTGRES_PASSWORD: disposable-ci-fixture-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:disposable-ci-fixture-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm backend:build
      - run: pnpm backend:test
      - name: Run PGlite-only recovery regressions
        working-directory: services/supabase-api
        shell: bash
        run: |
          set -euo pipefail
          report_file="$(mktemp "${TMPDIR:-/tmp}/lovelies-pglite.XXXXXXXX")"
          trap 'rm -f "$report_file"' EXIT
          env -u TEST_DATABASE_URL node --experimental-transform-types \
            --import ./test/offline-regression-guard.mjs --test --test-reporter=tap \
            --test-concurrency=1 test/retention-finalization-count.test.mjs \
            test/notification-redirect-cancel.test.mjs \
            test/service-fetcher-push-consumer.test.mjs \
            test/job-stale-completion.test.mjs \
            test/notification-terminal-race.test.mjs \
            test/notification-unconfirmed-delivery.test.mjs \
            test/notification-device-removal-race.test.mjs \
            test/notification-logout-delivery-race.test.mjs \
            test/storage-status-cleanup-runtime.test.mjs | tee "$report_file"
          grep -qx '# tests 67' "$report_file"
          grep -qx '# pass 67' "$report_file"
          grep -qx '# fail 0' "$report_file"
          grep -qx '# skipped 0' "$report_file"
      - run: pnpm backend:client:test
      - run: node --test services/link-association-worker/test/worker.test.mjs
      - run: pnpm backup:test
      - run: pnpm admin:test
      - run: pnpm preview:test
      - run: pnpm push:check
      - run: pnpm push:test
# This workflow has no production secrets and never deploys or submits a store
# build. Models, real Storage, providers, native builds and hosted acceptance have
# separate required evidence. Earlier GitHub runs stopped before any jobs;
# this revised workflow has not passed GitHub CI.
