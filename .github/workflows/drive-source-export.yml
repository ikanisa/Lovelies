name: Lovelies source export for Drive consolidation
on:
  push:
    branches: [export/drive-consolidation-20261101]
    paths: [.github/workflows/drive-source-export.yml]
permissions:
  contents: read
concurrency:
  group: lovelies-drive-source-export
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 385de8659b737cbb383f184ce014d7dc165a2a1c
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Export every tracked blob without running project code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lovelies-export"
          export EXPORT_DIR="$RUNNER_TEMP/lovelies-export"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          sha = '385de8659b737cbb383f184ce014d7dc165a2a1c'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == sha
          root = pathlib.Path(os.environ['EXPORT_DIR'])
          entries = subprocess.check_output(['git', 'ls-tree', '-r', '-z', '--full-tree', sha]).split(b'\0')
          records = []
          archive = root / ('Lovelies-source-' + sha[:12] + '.zip')
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as out:
              for entry in entries:
                  if not entry:
                      continue
                  header, pathbytes = entry.split(b'\t', 1)
                  mode, kind, oid = header.decode().split()
                  path = pathbytes.decode('utf-8')
                  if kind != 'blob':
                      raise RuntimeError('Unresolved non-blob entry: ' + path)
                  p = pathlib.PurePosixPath(path)
                  if p.is_absolute() or '..' in p.parts or '\\' in path:
                      raise RuntimeError('Unsafe source path: ' + path)
                  data = subprocess.check_output(['git', 'cat-file', 'blob', oid])
                  if data.startswith(b'version https://git-lfs.github.com/spec/v1\n'):
                      raise RuntimeError('Unresolved Git LFS object: ' + path)
                  actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  if actual != oid:
                      raise RuntimeError('Git blob mismatch: ' + path)
                  info = zipfile.ZipInfo('Lovelies/' + path, (1980, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  info.external_attr = int(mode, 8) << 16
                  info.compress_type = zipfile.ZIP_DEFLATED
                  out.writestr(info, data)
                  records.append({'path': path, 'mode': mode, 'git_blob_sha1': oid, 'size': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          report = {'schema_version': 1, 'repository': 'ikanisa/Lovelies', 'source_commit': sha, 'source_branch': 'implementation/local-supabase-20261101', 'pull_request': 1, 'release_status': 'unmerged candidate, not production acceptance', 'file_count': len(records), 'total_bytes': sum(r['size'] for r in records), 'archive_sha256': hashlib.sha256(archive.read_bytes()).hexdigest(), 'files': records}
          (root / 'source-manifest.json').write_text(json.dumps(report, indent=2) + '\n')
          with zipfile.ZipFile(archive) as check:
              assert len(check.infolist()) == len(records)
              assert check.testzip() is None
          print(json.dumps({'file_count': len(records), 'total_bytes': report['total_bytes'], 'archive_sha256': report['archive_sha256']}))
          PY
      - name: Publish source archive and independent manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lovelies-source-385de8659b73
          path: ${{ runner.temp }}/lovelies-export/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
