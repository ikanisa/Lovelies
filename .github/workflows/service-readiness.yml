name: Lovelies service source readiness
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: service-readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check local deployment and evidence boundaries
        if: matrix.shard == 1
        run: node --experimental-transform-types --test --test-isolation=none --test-concurrency=1 scripts/local-supabase-config.test.mjs scripts/local-supabase-managed-auth-rotation.test.mjs scripts/test/release-gate.test.mjs scripts/test/observe-platform.test.mjs
      - name: Audit the exact locked dependency graph
        if: matrix.shard == 1
        run: pnpm audit --audit-level=moderate
      - run: pnpm backend:typecheck
      - run: pnpm restore-journal:check
      - run: pnpm backend:ml:typecheck
      - run: pnpm --filter @lovelies/ml-container-worker test
      - name: Run readiness regression package with isolated database processes
        run: node scripts/verify-readiness-package.mjs --output "${RUNNER_TEMP}/lovelies-readiness" --shard "${{ matrix.shard }}/3"
      - name: Retain actual local verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: service-readiness-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/lovelies-readiness/
          if-no-files-found: error
          retention-days: 14
# No secrets or live service calls. This supplements the existing native
# PostgreSQL/Deno job; it does not replace its different verification scope.
