name: Lovelies local readiness regressions

# Manual only: the owner has parked billed CI. Adding these files does not
# enable a new push/PR runner or change the existing workflow's triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-regressions:
    runs-on: ubuntu-24.04
    # The retained local baseline needed 45 minutes for its first 80 backend
    # files; reserve time for the complete serial suite and service fixtures.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/verify-local-readiness.mjs --output "${RUNNER_TEMP}/lovelies-local-readiness"
      - name: Retain actual verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-readiness-results
          path: ${{ runner.temp }}/lovelies-local-readiness/
          if-no-files-found: error
          retention-days: 14

# All service credentials in the fixtures are synthetic. Worker/SQLite tests
# use local emulation; this job never deploys or submits a native store build.
