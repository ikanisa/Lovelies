[project]
name = "pictured-ml-face"
version = "0.1.0"
description = "Private still-image face processing for Lovelies"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.124.0",
  "numpy>=2.3.5",
  "opencv-python-headless>=4.12.0.88,<5",
  "pillow>=11.3.0,<13",
  "pillow-heif>=1.1.1,<2",
  "pydantic>=2.12.5",
  "uvicorn>=0.38.0",
  "openface-still==0.1.0",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lovelies_ml_face", "src/pictured_ml_face"]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=9.0.1",
  "ruff>=0.14.6"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
# Publisher fixes: AnyIO GHSA-5p39-cfhj-2xmp/GHSA-82r6-8w77-94w6;
# Starlette GHSA-82w8-qh3p-5jfq/GHSA-jp82-jpqv-5vv3.
constraint-dependencies = ["anyio>=4.14.2,<5", "starlette>=1.3.1,<2"]

[tool.uv.sources]
openface-still = { path = "vendor/openface_still-0.1.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
